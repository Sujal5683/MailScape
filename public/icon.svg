<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Mail Intelligence app icon">
  <defs>
    <!-- Teal → deep-teal diagonal gradient (on-brand, avoids indigo/blue) -->
    <linearGradient id="mi-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0b4d47"/>
    </linearGradient>
    <!-- Subtle inner highlight for the envelope flap -->
    <linearGradient id="mi-flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed rounded-square background (safe for maskable) -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#mi-bg)"/>

  <!-- Envelope body (white) -->
  <rect x="124" y="188" width="264" height="176" rx="28" ry="28" fill="#ffffff"/>

  <!-- Envelope flap (teal stroke + soft fill) -->
  <path d="M 138 206 L 256 290 L 374 206"
        fill="none"
        stroke="url(#mi-flap)"
        stroke-width="22"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Envelope fold line (bottom hint) -->
  <path d="M 138 346 L 256 268 L 374 346"
        fill="none"
        stroke="#e2e8f0"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.6"/>

  <!-- Intelligence spark — 4-point star, top-right of envelope -->
  <path d="M 372 128 L 382 158 L 412 168 L 382 178 L 372 208 L 362 178 L 332 168 L 362 158 Z"
        fill="#fbbf24"/>

  <!-- Small accent sparkle (top-left) -->
  <g fill="#fde68a" opacity="0.95">
    <circle cx="150" cy="132" r="6"/>
    <circle cx="172" cy="110" r="3.5"/>
  </g>
</svg>
